<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahil Fitness — Scan to Train</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700;800&display=swap');

  :root {
    --crimson: #C8102E;
    --gold: #C9A84C;
    --black: #0A0A0A;
    --card2: #181818;
    --border: #222;
    --muted: #777;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: #E8E8E8;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .card {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 40px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--crimson), var(--gold));
  }
  .card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--gold), var(--crimson));
  }

  .glow {
    position: absolute;
    top: -80px; left: 50%; transform: translateX(-50%);
    width: 360px; height: 360px;
    background: radial-gradient(circle, rgba(200,16,46,0.13) 0%, transparent 70%);
    pointer-events: none;
  }

  .eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--crimson);
    margin-bottom: 6px;
    position: relative;
  }

  .brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 3px;
    color: var(--gold);
    margin-bottom: 4px;
    position: relative;
  }

  .tagline {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 32px;
    position: relative;
  }

  /* QR wrapper with corner accents */
  .qr-outer {
    position: relative;
    display: inline-block;
    padding: 12px;
    margin-bottom: 24px;
  }

  .qr-outer::before, .qr-outer::after,
  .qr-outer .bl, .qr-outer .br {
    content: '';
    position: absolute;
    width: 22px; height: 22px;
    border-color: var(--crimson);
    border-style: solid;
  }
  .qr-outer::before { top: 0; left: 0; border-width: 3px 0 0 3px; border-radius: 5px 0 0 0; }
  .qr-outer::after  { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 5px 0 0; }
  .qr-outer .bl     { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 5px; }
  .qr-outer .br     { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 5px 0; }

  .qr-inner {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 0 48px rgba(201,168,76,0.18);
    display: inline-block;
  }

  .qr-inner img {
    display: block;
    width: 220px;
    height: 220px;
    border-radius: 4px;
  }

  .scan-label {
    font-size: 12px;
    color: #999;
    margin-bottom: 10px;
    position: relative;
  }

  .btn-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    position: relative;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 24px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    text-decoration: none;
    transition: transform 0.2s, opacity 0.2s;
    font-family: 'Inter', sans-serif;
  }
  .btn:hover { transform: translateY(-2px); opacity: 0.88; }

  .btn-primary {
    background: linear-gradient(135deg, var(--crimson), #a50d25);
    color: #fff;
  }
  .btn-secondary {
    background: rgba(201,168,76,0.1);
    color: var(--gold);
    border: 1px solid rgba(201,168,76,0.4);
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 28px 0;
  }

  .footer-brand {
    font-size: 11px;
    color: #444;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .coach-line {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
    color: #555;
    margin-top: 4px;
  }
  .social-row {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 14px;
  }
  .social-pill {
    font-size: 11px;
    color: var(--muted);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    transition: color 0.2s, border-color 0.2s;
    letter-spacing: 1px;
  }
  .social-pill:hover { color: var(--gold); border-color: var(--gold); }

  @media (max-width: 480px) {
    .card { padding: 36px 20px; }
    .qr-inner img { width: 190px; height: 190px; }
  }
</style>
<script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>

<div class="card">
  <div class="glow"></div>

  <div class="eyebrow">Scan to Access</div>
  <div class="brand">SAHIL FITNESS</div>
  <div class="tagline">Women's Advanced Training Vault</div>

  <div class="qr-outer">
    <div class="bl"></div>
    <div class="br"></div>
    <div class="qr-inner">
      <img
        id="qrImg"
        src="https://api.qrserver.com/v1/create-qr-code/?size=440x440&data=https%3A%2F%2Ffitwid.fit%2F&format=png&ecc=H&margin=2&color=0A0A0A&bgcolor=FFFFFF"
        alt="QR Code — FitWid.fit"
        crossorigin="anonymous"
      >
    </div>
  </div>

  <div class="scan-label">Point your phone camera at the code</div>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="downloadQR()">⬇ Download QR</button>
    <a href="https://fitwid.fit/" target="_blank" rel="noopener" class="btn btn-secondary">↗ Open Site</a>
  </div>

  <div class="divider"></div>

  <div class="footer-brand">Sahil Fitness Club · Bangalore</div>
  <div class="coach-line">Coach Sahil Bansal</div>
  <div class="social-row">
    <a href="https://instagram.com/sahil_r_fitness" target="_blank" rel="noopener" class="social-pill">📸 Instagram</a>
    <a href="https://wa.me/917015552731" target="_blank" rel="noopener" class="social-pill">💬 WhatsApp</a>
    <a href="generator.html" class="social-pill">⚡ Generator</a>
    <a href="slots.html" class="social-pill">📅 Book Slot</a>
    <a href="launch.html" class="social-pill">🚀 Launch Page</a>
  </div>
</div>

<script>
  function downloadQR() {
    const img = document.getElementById('qrImg');
    const size = 500;

    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = 620;
    const ctx = canvas.getContext('2d');

    // Background
    ctx.fillStyle = '#0A0A0A';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Top gradient bar
    const grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
    grad.addColorStop(0, '#C8102E');
    grad.addColorStop(1, '#C9A84C');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, 6);

    // Brand name
    ctx.fillStyle = '#C9A84C';
    ctx.font = 'bold 40px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('SAHIL FITNESS', canvas.width / 2, 62);

    // Tagline
    ctx.fillStyle = '#777';
    ctx.font = '13px Arial';
    ctx.fillText("WOMEN'S ADVANCED TRAINING VAULT", canvas.width / 2, 88);

    // White QR background box
    const qrX = 100, qrY = 110, qrSize = 300;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(qrX, qrY, qrSize, qrSize, 14);
    } else {
      ctx.rect(qrX, qrY, qrSize, qrSize);
    }
    ctx.fill();

    // Draw QR image
    try {
      ctx.drawImage(img, qrX + 14, qrY + 14, qrSize - 28, qrSize - 28);
    } catch(e) {
      // If cross-origin blocked, just save without QR
    }

    // Corner accents
    ctx.strokeStyle = '#C8102E';
    ctx.lineWidth = 4;
    const cx = qrX - 8, cy = qrY - 8, cs = qrSize + 16, ca = 24;
    // TL
    ctx.beginPath(); ctx.moveTo(cx, cy + ca); ctx.lineTo(cx, cy); ctx.lineTo(cx + ca, cy); ctx.stroke();
    // TR
    ctx.beginPath(); ctx.moveTo(cx + cs - ca, cy); ctx.lineTo(cx + cs, cy); ctx.lineTo(cx + cs, cy + ca); ctx.stroke();
    // BL
    ctx.beginPath(); ctx.moveTo(cx, cy + cs - ca); ctx.lineTo(cx, cy + cs); ctx.lineTo(cx + ca, cy + cs); ctx.stroke();
    // BR
    ctx.beginPath(); ctx.moveTo(cx + cs - ca, cy + cs); ctx.lineTo(cx + cs, cy + cs); ctx.lineTo(cx + cs, cy + cs - ca); ctx.stroke();

    // URL
    ctx.fillStyle = '#C9A84C';
    ctx.font = '13px Arial';
    ctx.fillText('fitwid.fit', canvas.width / 2, 444);

    // Divider line
    ctx.fillStyle = '#222';
    ctx.fillRect(60, 462, canvas.width - 120, 1);

    // Footer
    ctx.fillStyle = '#555';
    ctx.font = '12px Arial';
    ctx.fillText('Sahil Fitness Club · Bangalore', canvas.width / 2, 490);
    ctx.fillStyle = '#777';
    ctx.font = 'bold 16px Arial';
    ctx.fillText('Coach Sahil Bansal', canvas.width / 2, 516);
    ctx.fillStyle = '#444';
    ctx.font = '12px Arial';
    ctx.fillText('@sahil_r_fitness  ·  +91 70155 52731', canvas.width / 2, 542);

    // Bottom gradient bar
    const grad2 = ctx.createLinearGradient(0, 0, canvas.width, 0);
    grad2.addColorStop(0, '#C9A84C');
    grad2.addColorStop(1, '#C8102E');
    ctx.fillStyle = grad2;
    ctx.fillRect(0, canvas.height - 6, canvas.width, 6);

    // Download
    const link = document.createElement('a');
    link.download = 'sahil-fitness-qr.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
</script>

</body>
</html>
