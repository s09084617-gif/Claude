<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Workout Generator — FitWid | Coach Sahil Bansal</title>
<meta name="description" content="Generate a fully custom workout plan. Select your muscle, level, goal and equipment — Coach Sahil's training system builds it instantly.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="/_vercel/speed-insights/script.js"></script>
<style>
/* ── TOKENS ── */
:root{
  --red:#CC0000;--red-b:#FF3B3B;--gold:#FFC107;--black:#0A0A0A;--dark:#1A1A1A;
  --surface:rgba(255,255,255,.04);--surface2:rgba(255,255,255,.07);
  --border:rgba(204,0,0,.18);--text:#F2F2F2;--muted:rgba(242,242,242,.5);
  --green:#22c55e;--wa:#25D366;--r:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--black);color:var(--text);font-family:'Montserrat',sans-serif;font-weight:500;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
button{cursor:pointer;border:none;background:none;font-family:inherit}

/* ── KEYFRAMES ── */
@keyframes glow-pulse{0%,100%{box-shadow:0 0 20px rgba(204,0,0,.4)}50%{box-shadow:0 0 40px rgba(204,0,0,.7)}}
@keyframes gold-shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes barFill{from{width:0}to{width:var(--fill)}}
@keyframes pulse-ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.6);opacity:0}}

/* ── NAV ── */
#navbar{position:sticky;top:0;z-index:200;background:rgba(10,10,10,.96);border-bottom:1px solid var(--border);backdrop-filter:blur(20px)}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:68px;display:flex;align-items:center;gap:28px}
.nav-logo{flex-shrink:0;display:flex;align-items:center}
.nav-logo img{height:52px;width:auto;transition:filter .3s}
.nav-logo:hover img{filter:drop-shadow(0 0 10px rgba(204,0,0,.8))}
.nav-links{display:flex;gap:28px;list-style:none;margin-left:auto}
.nav-links a{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);transition:color .2s}
.nav-links a:hover,.nav-links a.active{color:var(--red-b)}
.nav-cta{background:var(--red);color:#fff;padding:9px 20px;border-radius:8px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;transition:background .2s;flex-shrink:0}
.nav-cta:hover{background:var(--red-b)}
.hamburger{display:none;flex-direction:column;gap:5px;padding:4px;margin-left:auto}
.hamburger span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px;transition:.3s}
.mobile-nav{display:none;flex-direction:column;background:rgba(10,10,10,.99);border-top:1px solid var(--border);padding:20px 24px 28px;gap:4px}
.mobile-nav.open{display:flex}
.mobile-nav a{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:16px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05);transition:color .2s}
.mobile-nav a:hover{color:var(--text)}
@media(max-width:768px){.nav-links,.nav-cta{display:none}.hamburger{display:flex}}

/* ── HERO ── */
.gen-hero{background:linear-gradient(135deg,#110000 0%,#1a0000 40%,var(--black) 100%);border-bottom:1px solid var(--border);padding:64px 24px 52px;text-align:center;position:relative;overflow:hidden}
.gen-hero::before{content:'GENERATE';position:absolute;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:clamp(80px,20vw,200px);color:rgba(204,0,0,.04);top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none;letter-spacing:8px;line-height:1}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(204,0,0,.12);border:1px solid rgba(204,0,0,.35);border-radius:40px;padding:5px 16px;margin-bottom:20px}
.hero-badge-dot{width:6px;height:6px;border-radius:50%;background:var(--red-b);animation:glow-pulse 1.5s ease-in-out infinite}
.hero-badge span{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--red-b)}
.gen-hero h1{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:clamp(40px,8vw,80px);letter-spacing:3px;line-height:1;margin-bottom:12px}
.gen-hero h1 span{background:linear-gradient(90deg,#FFC107,#FFE066,#FFC107);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gold-shimmer 3s linear infinite}
.gen-hero p{font-family:'Rajdhani',sans-serif;font-size:17px;letter-spacing:1.5px;color:var(--muted);margin-top:8px}

/* ── WIZARD SHELL ── */
.wizard{max-width:820px;margin:0 auto;padding:48px 20px 80px}

/* ── PROGRESS BAR ── */
.progress-wrap{margin-bottom:48px}
.step-labels{display:flex;justify-content:space-between;margin-bottom:16px}
.step-label{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.step-dot{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;color:var(--muted);transition:all .35s;position:relative;z-index:1}
.step-dot.done{background:var(--red);border-color:var(--red);color:#fff}
.step-dot.active{background:rgba(204,0,0,.15);border-color:var(--red);color:var(--red-b);box-shadow:0 0 0 4px rgba(204,0,0,.15)}
.step-dot.active::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:1px solid rgba(204,0,0,.3);animation:pulse-ring 1.5s ease-out infinite}
.step-name{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-align:center;transition:color .35s}
.step-label.done .step-name,.step-label.active .step-name{color:var(--text)}
.progress-track{height:3px;background:rgba(255,255,255,.07);border-radius:2px;position:relative;margin:-32px 0 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1);width:0}

/* ── STEP CARD ── */
.step-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:36px;display:none;animation:fadeIn .4s ease}
.step-card.active{display:block}
.step-num{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--red-b);margin-bottom:8px}
.step-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:26px;letter-spacing:1px;color:var(--text);margin-bottom:6px}
.step-sub{font-size:13px;color:var(--muted);margin-bottom:28px}

/* ── OPTION GRID ── */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:32px}
.opts.cols-3{grid-template-columns:repeat(3,1fr)}
.opts.cols-4{grid-template-columns:repeat(4,1fr)}
.opt{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:10px;padding:18px 14px;cursor:pointer;transition:all .2s;text-align:center;user-select:none;position:relative;overflow:hidden}
.opt::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(204,0,0,.05),transparent);opacity:0;transition:opacity .2s}
.opt:hover{border-color:rgba(204,0,0,.4);transform:translateY(-2px)}
.opt:hover::before{opacity:1}
.opt.selected{background:rgba(204,0,0,.12);border-color:var(--red);color:#fff}
.opt.selected::before{opacity:1}
.opt.gold-opt.selected{background:rgba(255,193,7,.1);border-color:var(--gold)}
.opt-icon{font-size:26px;margin-bottom:10px;display:block}
.opt-label{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;letter-spacing:.5px;text-transform:uppercase;color:var(--text);margin-bottom:3px}
.opt-sub{font-size:11px;color:var(--muted);letter-spacing:.5px}
.opt-badge{position:absolute;top:8px;right:8px;background:var(--gold);color:var(--black);font-family:'Rajdhani',sans-serif;font-weight:700;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:2px 6px;border-radius:3px}

/* ── NAV BUTTONS ── */
.step-nav{display:flex;gap:12px;justify-content:space-between;align-items:center}
.btn-back{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:12px 24px;border-radius:8px;border:1.5px solid rgba(255,255,255,.1);transition:all .2s}
.btn-back:hover{border-color:rgba(255,255,255,.3);color:var(--text)}
.btn-next{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;letter-spacing:2px;text-transform:uppercase;background:var(--red);color:#fff;padding:14px 36px;border-radius:8px;transition:all .25s;position:relative;overflow:hidden;display:flex;align-items:center;gap:10px}
.btn-next:hover{background:var(--red-b);transform:translateY(-2px);box-shadow:0 8px 24px rgba(204,0,0,.4)}
.btn-next:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}
.btn-generate{background:linear-gradient(135deg,var(--red),#990000);color:#fff;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:18px;letter-spacing:3px;text-transform:uppercase;width:100%;padding:20px;border-radius:10px;transition:all .25s;animation:glow-pulse 2.5s ease-in-out infinite;display:flex;align-items:center;justify-content:center;gap:12px}
.btn-generate:hover{transform:translateY(-3px);box-shadow:0 16px 48px rgba(204,0,0,.5)}
.btn-generate:disabled{animation:none;opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

/* ── SUMMARY CHIPS ── */
.selection-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.sel-chip{background:rgba(204,0,0,.08);border:1px solid rgba(204,0,0,.25);border-radius:6px;padding:5px 12px;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--red-b)}

/* ── LOADING ── */
.gen-loading{display:none;text-align:center;padding:64px 32px;animation:fadeIn .3s ease}
.gen-loading-ring{width:72px;height:72px;border:3px solid rgba(255,255,255,.05);border-top:3px solid var(--red);border-right:3px solid var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 28px}
.gen-loading h3{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:22px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.gen-loading p{font-size:14px;color:var(--muted)}
.loading-steps{display:flex;flex-direction:column;gap:10px;margin-top:28px;max-width:320px;margin-left:auto;margin-right:auto}
.l-step{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);opacity:0;transition:opacity .3s}
.l-step.lit{opacity:1;color:var(--text)}
.l-step-dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0;transition:background .3s}
.l-step.lit .l-step-dot{background:var(--green)}

/* ── RESULT ── */
#genResult{display:none;animation:fadeIn .5s ease}

/* Result header */
.res-header{background:linear-gradient(135deg,rgba(204,0,0,.15),rgba(10,10,10,0));border:1px solid rgba(204,0,0,.35);border-radius:var(--r);padding:32px;margin-bottom:20px}
.res-label{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--red-b);margin-bottom:10px}
.res-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:clamp(26px,5vw,40px);letter-spacing:2px;line-height:1.1;margin-bottom:16px}
.res-title span{color:var(--gold)}
.res-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.res-chip{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:5px 12px;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.res-chip.gold{color:var(--gold);border-color:rgba(255,193,7,.3)}
.res-chip.red{color:var(--red-b);border-color:rgba(204,0,0,.3)}
.res-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:20px;border-top:1px solid rgba(255,255,255,.06)}
.btn-wa{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;padding:11px 20px;border-radius:8px;transition:all .2s}
.btn-wa:hover{background:#1aab52;transform:translateY(-2px)}
.btn-apply{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;padding:11px 20px;border-radius:8px;transition:all .2s}
.btn-apply:hover{background:var(--red-b);transform:translateY(-2px)}
.btn-regen{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:var(--muted);font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;padding:11px 20px;border-radius:8px;transition:all .2s}
.btn-regen:hover{border-color:var(--gold);color:var(--gold)}

/* Stats bar */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--dark);border:1px solid rgba(255,255,255,.06);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.stat-item{padding:20px 16px;text-align:center;border-right:1px solid rgba(255,255,255,.06)}
.stat-item:last-child{border-right:none}
.stat-val{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:28px;color:var(--gold);line-height:1}
.stat-lbl{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-top:4px}

/* Warm-up / Cool-down */
.protocol-block{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:var(--r);padding:24px;margin-bottom:16px}
.protocol-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.protocol-title span{font-size:18px}
.protocol-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.proto-item{background:rgba(255,255,255,.03);border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:10px}
.proto-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.proto-dot.red{background:var(--red)}
.proto-dot.gold{background:var(--gold)}
.proto-dot.green{background:var(--green)}
.proto-text{font-size:13px;color:var(--text);line-height:1.4}
.proto-dur{font-family:'Rajdhani',sans-serif;font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:2px}

/* Exercise table */
.ex-table{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.ex-table-head{display:grid;grid-template-columns:36px 1fr 70px 90px 70px 70px 80px;background:rgba(255,255,255,.03);padding:12px 20px;font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.05)}
.ex-row{display:grid;grid-template-columns:36px 1fr 70px 90px 70px 70px 80px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.04);align-items:center;transition:background .15s}
.ex-row:last-child{border-bottom:none}
.ex-row:hover{background:rgba(204,0,0,.04)}
.ex-num{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:18px;color:rgba(204,0,0,.4)}
.ex-name-wrap{}
.ex-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;color:var(--text);line-height:1.2;margin-bottom:3px}
.ex-type-tag{display:inline-block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:2px 8px;border-radius:3px;margin-bottom:2px}
.ex-type-tag.compound{background:rgba(204,0,0,.12);color:var(--red-b)}
.ex-type-tag.isolation{background:rgba(255,193,7,.08);color:var(--gold)}
.ex-type-tag.isometric{background:rgba(34,197,94,.08);color:#22c55e}
.ex-sub{font-size:11px;color:var(--muted);line-height:1.4}
.ex-sets{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;color:var(--gold);text-align:center}
.ex-reps{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;color:var(--text);text-align:center}
.ex-rest{font-size:12px;color:var(--muted);text-align:center}
.ex-tempo{font-size:12px;color:var(--muted);text-align:center;font-family:'Rajdhani',sans-serif;font-weight:600;letter-spacing:1px}
.ex-rpe{text-align:center}
.rpe-pill{display:inline-block;padding:4px 10px;border-radius:4px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;letter-spacing:1px}
.rpe-low{background:rgba(34,197,94,.12);color:#22c55e}
.rpe-med{background:rgba(255,193,7,.12);color:var(--gold)}
.rpe-high{background:rgba(204,0,0,.12);color:var(--red-b)}
.ex-tech-row{grid-column:2/-1;padding:8px 0 4px}
.tech-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(204,0,0,.08);border:1px solid rgba(204,0,0,.2);border-radius:4px;padding:4px 10px;font-size:11px;color:var(--red-b);font-family:'Rajdhani',sans-serif;font-weight:600;letter-spacing:1px;margin-right:6px}

/* Coach tip */
.coach-tip{background:linear-gradient(135deg,rgba(255,193,7,.07),rgba(10,10,10,0));border:1px solid rgba(255,193,7,.2);border-radius:var(--r);padding:24px;margin-bottom:16px;display:flex;gap:16px}
.tip-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--red),rgba(255,193,7,.5));display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;border:2px solid rgba(255,193,7,.3)}
.tip-body{}
.tip-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.tip-text{font-size:13px;color:var(--muted);line-height:1.7}

/* Protocol tip */
.protocol-tip{background:linear-gradient(135deg,rgba(34,197,94,.06),rgba(10,10,10,0));border:1px solid rgba(34,197,94,.2);border-radius:var(--r);padding:24px;margin-bottom:16px;display:flex;gap:16px}
.protocol-tip .tip-title{color:#22c55e}

/* Weekly split */
.split-block{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:var(--r);padding:24px;margin-bottom:16px}
.split-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.split-days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.split-day{background:rgba(255,255,255,.03);border-radius:8px;padding:10px 6px;text-align:center;border:1px solid rgba(255,255,255,.05)}
.split-day.active{background:rgba(204,0,0,.1);border-color:rgba(204,0,0,.3)}
.split-day.gold-day{background:rgba(255,193,7,.06);border-color:rgba(255,193,7,.2)}
.split-day.rest{opacity:.4}
.day-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.day-focus{font-size:10px;color:var(--text);line-height:1.3}

/* CTA banner */
.cta-banner{background:linear-gradient(135deg,rgba(204,0,0,.12),rgba(10,10,10,0));border:1px solid rgba(204,0,0,.3);border-radius:var(--r);padding:36px;text-align:center;margin-top:8px}
.cta-banner h3{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:clamp(22px,4vw,32px);letter-spacing:1px;margin-bottom:10px}
.cta-banner p{font-size:14px;color:var(--muted);margin-bottom:24px;max-width:480px;margin-left:auto;margin-right:auto}

/* Email gate */
#emailGate{display:none;animation:fadeIn .3s ease}
.gate-card{background:rgba(10,10,10,.96);backdrop-filter:blur(12px);border:1px so
