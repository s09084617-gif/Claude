<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Client Portal · I-BLITZ Fitness · Coach Sahil</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --crimson:#CC0000;
  --crimson-dark:#8B0000;
  --gold:#C9A84C;
  --gold-light:#F0C96A;
  --dark:#0A0A0A;
  --dark2:#111111;
  --dark3:#1A1A1A;
  --dark4:#222222;
  --border:#2a2a2a;
  --border2:#333333;
  --text:#F5F0E8;
  --muted:#888888;
  --muted2:#555555;
  --green:#25D366;
  --green2:#22c55e;
}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{background:var(--dark);color:var(--text);font-family:'Montserrat',sans-serif;min-height:100vh;overflow-x:hidden}

/* ── BACKGROUND ── */
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(204,0,0,0.14) 0%,transparent 55%),radial-gradient(ellipse at 85% 80%,rgba(201,168,76,0.05) 0%,transparent 40%);pointer-events:none;z-index:0}

/* ══════════════════════════════
   LOGIN SCREEN
══════════════════════════════ */
#loginScreen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--dark)}
#loginScreen::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(204,0,0,0.18) 0%,transparent 55%);pointer-events:none}
.login-card{position:relative;z-index:1;background:var(--dark2);border:1px solid var(--border);border-radius:16px;padding:40px 32px;max-width:400px;width:100%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,0.6)}
.login-logo{font-family:'Montserrat',sans-serif;font-size:36px;font-weight:900;letter-spacing:6px;background:linear-gradient(135deg,var(--crimson),var(--crimson-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.login-subtitle{font-size:11px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.login-desc{font-size:13px;color:var(--muted);margin-bottom:32px;font-weight:500}
.form-group{margin-bottom:16px;text-align:left}
.form-label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:8px}
.form-input{width:100%;background:#161616;border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:'Montserrat',sans-serif;font-size:16px;font-weight:500;padding:14px 16px;outline:none;transition:border .2s;-webkit-appearance:none}
.form-input:focus{border-color:var(--crimson)}
.form-input::placeholder{color:#333;font-weight:400}

/* PIN dots */
.pin-field-wrap{position:relative}
.pin-dots-row{display:flex;gap:10px;justify-content:center;margin-top:10px}
.pin-dot-disp{width:12px;height:12px;border-radius:50%;border:2px solid var(--border2);transition:all .15s}
.pin-dot-disp.filled{background:var(--crimson);border-color:var(--crimson)}

.btn-login{width:100%;background:var(--green2);color:#fff;font-family:'Montserrat',sans-serif;font-size:14px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:16px;border:none;border-radius:8px;cursor:pointer;transition:all .2s;margin-top:8px}
.btn-login:hover{background:#16a34a;transform:translateY(-1px)}
.btn-login:active{transform:translateY(0)}
.login-error{background:rgba(204,0,0,0.1);border:1px solid rgba(204,0,0,0.3);border-radius:6px;padding:10px 14px;color:#ff6b6b;font-size:13px;font-weight:600;margin-top:12px;display:none}
.login-footer{margin-top:24px;padding-top:20px;border-top:1px solid var(--border);font-size:12px;color:var(--muted2)}
.login-footer a{color:var(--green);text-decoration:none;font-weight:600}
.login-footer a:hover{text-decoration:underline}

/* ══════════════════════════════
   DASHBOARD
══════════════════════════════ */
#dashboard{display:none;min-height:100vh;position:relative;z-index:1;padding-bottom:80px}

/* Top bar */
.topbar{position:sticky;top:0;z-index:50;background:rgba(10,10,10,0.95);border-bottom:1px solid var(--border);backdrop-filter:blur(12px);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.topbar-back{background:none;border:1px solid var(--border2);color:var(--muted);font-size:18px;width:36px;height:36px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:'Montserrat',sans-serif}
.topbar-back:hover{border-color:var(--crimson);color:var(--text)}
.topbar-title{font-size:13px;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:var(--text)}
.topbar-name{font-size:13px;font-weight:700;color:var(--gold);max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.dash-content{padding:16px;max-width:680px;margin:0 auto}

/* Welcome card */
.welcome-card{background:linear-gradient(135deg,var(--crimson-dark) 0%,var(--crimson) 60%,#aa0000 100%);border-radius:14px;padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.welcome-card::after{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.05)}
.welcome-card::before{content:'';position:absolute;bottom:-20px;left:-20px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,0.03)}
.welcome-name{font-size:20px;font-weight:900;color:#fff;margin-bottom:8px;letter-spacing:.5px;position:relative;z-index:1}
.goal-chip{display:inline-block;background:rgba(201,168,76,0.2);border:1px solid rgba(201,168,76,0.4);color:var(--gold-light);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:4px 12px;border-radius:20px;margin-bottom:12px;position:relative;z-index:1}
.next-session{font-size:12px;font-weight:600;color:rgba(255,255,255,0.7);margin-bottom:12px;position:relative;z-index:1;display:flex;align-items:center;gap:6px}
.coach-note-box{background:rgba(0,0,0,0.25);border:1px solid rgba(201,168,76,0.35);border-radius:8px;padding:12px;position:relative;z-index:1}
.coach-note-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.coach-note-text{font-size:13px;color:rgba(255,255,255,0.85);font-weight:500;line-height:1.5}

/* Macro bar */
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.macro-card{background:var(--dark2);border:1px solid var(--border);border-radius:10px;padding:12px 8px;text-align:center;border-top:2px solid var(--crimson)}
.macro-val{font-size:20px;font-weight:900;color:var(--crimson);letter-spacing:-.5px}
.macro-unit{font-size:10px;font-weight:600;color:var(--muted)}
.macro-lbl{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted2);margin-top:2px}

/* Section header */
.sec-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;margin-top:24px}
.sec-line{flex:1;height:1px;background:var(--border)}
.sec-title{font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--gold);white-space:nowrap}

/* Meal cards */
.meal-card{background:var(--dark2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;transition:border-color .2s}
.meal-card:hover{border-color:rgba(204,0,0,0.3)}
.meal-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.meal-time{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:1px}
.meal-name{font-size:16px;font-weight:800;color:#fff;margin-top:2px}
.meal-cal-badge{background:rgba(204,0,0,0.15);border:1px solid rgba(204,0,0,0.3);color:var(--crimson);font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.food-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.food-chip{background:var(--dark3);border:1px solid var(--border2);color:var(--muted);font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px}

/* Day tabs */
.day-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{flex-shrink:0;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--dark2);color:var(--muted);font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .15s;font-family:'Montserrat',sans-serif;text-transform:uppercase}
.day-tab:hover{border-color:rgba(204,0,0,0.4);color:var(--text)}
.day-tab.active{background:var(--crimson);border-color:var(--crimson);color:#fff}
.day-tab.rest{color:var(--muted2)}

/* Workout display */
.workout-focus{display:inline-flex;align-items:center;gap:8px;background:rgba(204,0,0,0.1);border:1px solid rgba(204,0,0,0.25);border-radius:8px;padding:10px 16px;margin-bottom:16px}
.workout-focus-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.workout-focus-val{font-size:15px;font-weight:800;color:#fff}

.exercise-table{background:var(--dark2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.ex-header{display:grid;grid-template-columns:28px 1fr 50px 70px 55px;gap:0;padding:10px 14px;background:var(--dark3);border-bottom:1px solid var(--border)}
.ex-header span{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.ex-row{display:grid;grid-template-columns:28px 1fr 50px 70px 55px;gap:0;padding:12px 14px;border-bottom:1px solid var(--border);align-items:center;transition:background .15s}
.ex-row:last-child{border-bottom:none}
.ex-row:nth-child(even){background:rgba(255,255,255,0.015)}
.ex-row:hover{background:rgba(204,0,0,0.04)}
.ex-num{font-size:12px;font-weight:700;color:var(--muted2)}
.ex-name{font-size:13px;font-weight:700;color:var(--text)}
.ex-val{font-size:13px;font-weight:600;color:var(--crimson);text-align:center}
.ex-rest{font-size:12px;font-weight:500;color:var(--muted);text-align:center}
.rest-day{text-align:center;padding:32px 20px;color:var(--muted)}
.rest-day .rest-icon{font-size:36px;margin-bottom:8px}
.rest-day p{font-size:14px;font-weight:600;color:var(--muted2)}
.split-badge{display:inline-block;background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.25);color:var(--gold);font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:4px 10px;border-radius:4px;margin-bottom:12px}

/* Footer actions */
.dash-footer{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,0.97);border-top:1px solid var(--border);padding:12px 16px;display:none;gap:10px;z-index:40;backdrop-filter:blur(10px)}
.dash-footer.visible{display:flex}
.btn-wa-full{flex:1;background:var(--green);color:#fff;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;padding:12px;border:none;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;text-decoration:none}
.btn-wa-full:hover{background:#1aab52}
.btn-book-full{flex:1;background:var(--crimson);color:#fff;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;padding:12px;border:none;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;text-decoration:none}
.btn-book-full:hover{background:var(--crimson-dark)}

/* Loading spinner */
.loading-overlay{position:fixed;inset:0;background:var(--dark);z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--crimson);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}

@media(max-width:400px){
  .macro-val{font-size:16px}
  .ex-header{grid-template-columns:24px 1fr 44px 60px 48px;padding:8px 10px}
  .ex-row{grid-template-columns:24px 1fr 44px 60px 48px;padding:10px 10px}
  .ex-name{font-size:12px}
  .login-card{padding:32px 20px}
}
@media(min-width:600px){
  .dash-content{padding:20px}
  .macro-val{font-size:24px}
}
</style>
<script>

<!-- LOADING -->

  <div class="spinner"></div>

</div>

<!-- ═══════════════════════════
     LOGIN SCREEN
═══════════════════════════ -->
<div id="loginScreen">
  <div class="login-card">

<!-- ═══════════════════════════
     DASHBOARD

<div id="dashboard">

    <!-- Macros -->
    <div class="macro-grid">

</div><!-- /dashboard -->

        { name: "Calf Raises", sets: 4, reps: "15-20", rest: "45s" }
      ]},
      Thursday: { focus: "Shoulders", exercises: [
        { name: "Overhead Press", sets: 4, reps: "8-10", rest: "90s" },
        { name: "Lateral Raises", sets: 4, reps: "12-15", rest: "60s" },
        { name: "Face Pulls", sets: 3, reps: "15-20", rest: "60s" },
        { name: "Rear Delt Flyes", sets: 3, reps: "12-15", rest: "60s" },
        { name: "Arnold Press", sets: 3, reps: "10-12", rest: "75s" }
      ]},
      Friday: { focus: "Arms", exercises: [
        { name: "Barbell Curl", sets: 4, reps: "10-12", rest: "60s" },
        { name: "Hammer Curl", sets: 3, reps: "12-15", rest: "60s" },
        { name: "Concentration Curl", sets: 3, reps: "12-15", rest: "45s" },
        { name: "Tricep Dips", sets: 3, reps: "10-12", rest: "75s" },
        { name: "Overhead Tricep Extension", sets: 3, reps: "12-15", rest: "60s" }
      ]},
      Saturday: { focus: "Core & Cardio", exercises: [
        { name: "Plank", sets: 3, reps: "60 sec", rest: "45s" },
        { name: "Cable Crunches", sets: 3, reps: "15-20", rest: "45s" },
        { name: "Hanging Leg Raises", sets: 3, reps: "12-15", rest: "60s" },
        { name: "Treadmill HIIT", sets: 1, reps: "20 min", rest: "—" }
      ]},
      Sunday: { focus: "Rest & Recovery", exercises: [] }
    }
  }
};

const DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DAY_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

let currentPlan = null;
let selectedDay = DAY_NAMES[new Date().getDay()];
let fbDB = null;

// ── PIN dots update ──
document.getElementById('pinInput').addEventListener('input', function(){
  const len = this.value.length;
  for(let i=0;i<6;i++){
    document.getElementById('pd'+i).classList.toggle('filled', i<len);
  }
});
document.getElementById('pinInput').addEventListener('keydown', function(e){
  if(e.key==='Enter') login();
});
document.getElementById('phoneInput').addEventListener('keydown', function(e){
  if(e.key==='Enter') document.getElementById('pinInput').focus();
});

// ══════════════════════════════════════════
//  LOGIN
// ══════════════════════════════════════════
async function login() {
  const phoneInput = document.getElementById('phoneInput');
  const pinInput = document.getElementById('pinInput');
  const loginBtn = document.getElementById('loginBtn');
  const errorEl = document.getElementById('loginError');

  const phone = phoneInput.value.trim().replace(/\s/g,'');
  const pin = pinInput.value.trim();

  if(!phone){ showLoginError('Please enter your phone number'); return; }
  if(!pin){ showLoginError('Please enter your PIN'); return; }

  loginBtn.textContent = 'Verifying...';
  loginBtn.disabled = true;
  errorEl.style.display = 'none';

  // Try Firebase first
  if(FB_READY) {
    try {
      if(!fbDB) {
        firebase.initializeApp(FIREBASE_CONFIG);
        fbDB = firebase.database();
      }
      const snapshot = await fbDB.ref('clients/' + phone).once('value');
      const clientData = snapshot.val();

      if(clientData && clientData.pin === pin) {
        // Merge with demo plan for missing fields
        const plan = mergePlan(clientData);
        showDashboard(plan);
        return;
      } else if(clientData && clientData.pin !== pin) {
        showLoginError('Incorrect PIN. Please try again.');
        loginBtn.textContent = 'Access My Plan';
        loginBtn.disabled = false;
        return;
      }
      // Client not found in Firebase → fall through to demo
    } catch(e) {
      console.warn('Firebase error:', e);
      // Fall through to demo mode
    }
  }

  // Demo mode: any phone + PIN 1234
  if(pin === '1234') {
    const demoCopy = JSON.parse(JSON.stringify(DEMO_PLAN));
    showDashboard(demoCopy);
  } else {
    showLoginError('Phone number not found. Contact Coach Sahil to get access. (Demo: PIN 1234)');
    loginBtn.textContent = 'Access My Plan';
    loginBtn.disabled = false;
  }
}

function mergePlan(clientData) {
  // Use DEMO_PLAN as base, override with client's actual data
  const plan = JSON.parse(JSON.stringify(DEMO_PLAN));
  plan.name = clientData.name || plan.name;
  plan.goal = clientData.goal || plan.goal;
  plan.coachNotes = clientData.coachNotes || plan.coachNotes;
  plan.nextSession = clientData.nextSession || plan.nextSession;
  if(clientData.dietPlan && clientData.dietPlan.calories) {
    plan.dietPlan = clientData.dietPlan;
  }
  if(clientData.workoutPlan && clientData.workoutPlan.days) {
    plan.workoutPlan = clientData.workoutPlan;
  }
  return plan;
}

function showLoginError(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.style.display = 'block';
}

// ══════════════════════════════════════════
//  DASHBOARD RENDER
// ══════════════════════════════════════════
function showDashboard(plan) {
  currentPlan = plan;

  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('dashFooter').classList.add('visible');

  renderWelcome(plan);
  renderMacros(plan.dietPlan);
  renderMeals(plan.dietPlan.meals || []);
  renderWorkoutSection(plan.workoutPlan);
}

function logout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('dashFooter').classList.remove('visible');
  document.getElementById('loginBtn').textContent = 'Access My Plan';
  document.getElementById('loginBtn').disabled = false;
  document.getElementById('loginError').style.display = 'none';
  document.getElementById('pinInput').value = '';
  // Reset pin dots
  for(let i=0;i<6;i++) document.getElementById('pd'+i).classList.remove('filled');
  currentPlan = null;
}

function renderWelcome(plan) {
  const firstName = (plan.name || 'Client').split(' ')[0];
  document.getElementById('topbarName').textContent = firstName;
  document.getElementById('welcomeName').textContent = 'Welcome back, ' + firstName + '!';
  document.getElementById('goalChip').textContent = plan.goal || 'Fitness';

  // Next session
  let sessionText = '—';
  if(plan.nextSession) {
    try {
      const d = new Date(plan.nextSession);
      sessionText = 'Next session: ' + d.toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short'}) + ' · ' + d.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
    } catch(e) { sessionText = plan.nextSession; }
  }
  document.getElementById('nextSessionText').textContent = sessionText;

  // Coach note
  if(plan.coachNotes) {
    document.getElementById('coachNoteText').textContent = plan.coachNotes;
    document.getElementById('coachNoteBox').style.display = 'block';
  }
}

function renderMacros(diet) {
  document.getElementById('m-cal').textContent = diet.calories || '—';
  document.getElementById('m-protein').textContent = diet.protein || '—';
  document.getElementById('m-carbs').textContent = diet.carbs || '—';
  document.getElementById('m-fats').textContent = diet.fats || '—';
}

function renderMeals(meals) {
  const container = document.getElementById('mealCards');
  if(!meals || !meals.length) {
    container.innerHTML = '<p style="color:var(--muted);font-size:13px;text-align:center;padding:20px">No meal plan assigned yet.</p>';
    return;
  }
  container.innerHTML = meals.map(meal => `
    <div class="meal-card">
      <div class="meal-top">
        <div>
          <div class="meal-time">${meal.time || ''}</div>
          <div class="meal-name">${meal.name || ''}</div>
        </div>
        <div class="meal-cal-badge">${meal.calories || 0} kcal</div>
      </div>
      <div class="food-chips">
        ${(meal.foods || []).map(f => `<span class="food-chip">${f}</span>`).join('')}
      </div>
    </div>
  `).join('');
}

function renderWorkoutSection(workoutPlan) {
  // Split badge
  const splitWrap = document.getElementById('splitBadgeWrap');
  if(workoutPlan.split) {
    splitWrap.innerHTML = `<div class="split-badge">${workoutPlan.split}</div>`;
  } else {
    splitWrap.innerHTML = '';
  }

  // Day tabs
  const tabsEl = document.getElementById('dayTabs');
  tabsEl.innerHTML = DAY_NAMES.map((day, i) => {
    const dayData = workoutPlan.days && workoutPlan.days[day];
    const isRest = !dayData || !dayData.exercises || dayData.exercises.length === 0;
    const isActive = day === selectedDay;
    return `<button class="day-tab ${isActive ? 'active' : ''} ${isRest ? 'rest' : ''}" onclick="selectDay('${day}', this)">${DAY_SHORT[i]}</button>`;
  }).join('');

  renderWorkoutDay(workoutPlan, selectedDay);
}

function selectDay(day, el) {
  selectedDay = day;
  document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderWorkoutDay(currentPlan.workoutPlan, day);
}

function renderWorkoutDay(workoutPlan, day) {
  const container = document.getElementById('workoutContent');
  const dayData = workoutPlan.days && workoutPlan.days[day];

  if(!dayData || !dayData.exercises || dayData.exercises.length === 0) {
    container.innerHTML = `
      <div class="exercise-table">
        <div class="rest-day">
          <div class="rest-icon">&#128564;</div>
          <p>${dayData && dayData.focus ? dayData.focus : 'Rest & Recovery'}</p>
          <p style="font-size:12px;margin-top:6px;color:var(--muted2)">Active recovery, stretching, or light walk</p>
        </div>
      </div>`;
    return;
  }

  container.innerHTML = `
    <div class="workout-focus">
      <div>
        <div class="workout-focus-label">Today's Focus</div>
        <div class="workout-focus-val">${dayData.focus || day}</div>
      </div>
    </div>
    <div class="exercise-table">
      <div class="ex-header">
        <span>#</span>
        <span>Exercise</span>
        <span style="text-align:center">Sets</span>
        <span style="text-align:center">Reps</span>
        <span style="text-align:center">Rest</span>
      </div>
      ${dayData.exercises.map((ex, i) => `
        <div class="ex-row">
          <div class="ex-num">${i+1}</div>
          <div class="ex-name">${ex.name}</div>
          <div class="ex-val">${ex.sets}</div>
          <div class="ex-val">${ex.reps}</div>
          <div class="ex-rest">${ex.rest}</div>
        </div>
      `).join('')}
    </div>`;
}
</script>
</body>
