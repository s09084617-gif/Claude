version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: iblitz
      POSTGRES_PASSWORD: iblitz123
      POSTGRES_DB: iblitz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema_v3.sql:/docker-entrypoint-initdb.d/schema_v3.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iblitz"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://iblitz:iblitz123@db:5432/iblitz
      SECRET_KEY: ${SECRET_KEY:-iblitz-dev-secret-change-me}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    command: python3 -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev -- --host

volumes:
  pgdata:
